name: Feature request
description: An idea that would make Game Center more useful
title: "[idea] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem you want solved
      description: What are you trying to do that the plugin makes hard today?
    validations:
      required: true
  - type: textarea
    id: wanted
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: Anything you have tried instead
  - type: markdown
    attributes:
      value: |
        Please do not paste a recovery key, a provider key or personal data. Security problems belong in the private **Report a vulnerability** form.
