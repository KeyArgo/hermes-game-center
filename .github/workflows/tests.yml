name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # The plugin runs on the person's own machine, so the suite runs where those machines are: Linux, macOS
  # and Windows. fail-fast stays off so one OS failing still reports the other two, and the job name carries
  # the OS so a red build says which one.
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    name: pytest (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the test dependencies
        run: python -m pip install -U pip pytest aiohttp fastapi pillow numpy
      - name: Run the suite
        run: python -m pytest tests -q -p no:cacheprovider
      # bash on every runner, so one script serves all three platforms (Windows' default shell is pwsh,
      # where `python3` and `node ... &&` chains behave differently).
      - name: Run the UI harnesses against the built bundle
        shell: bash
        run: |
          python3 tools/build_plugin.py
          node tests/table_ui_harness.cjs
          node tests/jackpot_overlay_harness.cjs
          node tests/jackpot2_harness.cjs
          node tests/jackpot2_look_harness.cjs
          node tests/timers_harness.cjs
