<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Game Center">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101a33"/><stop offset="1" stop-color="#070b16"/></linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ee0c5"/><stop offset="1" stop-color="#a99bff"/></linearGradient>
    <linearGradient id="pawn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9c3ff"/></linearGradient>
    <linearGradient id="chk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff7a8f"/><stop offset="1" stop-color="#d93a5a"/></linearGradient>
    <radialGradient id="g" cx=".5" cy=".6" r=".5"><stop offset="0" stop-color="#3ee0c5" stop-opacity=".38"/><stop offset="1" stop-color="#3ee0c5" stop-opacity="0"/></radialGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#b)"/>
  <ellipse cx="512" cy="600" rx="420" ry="340" fill="url(#g)"/>
  <!-- the board, seen at an angle -->
  <g transform="translate(512 640) scale(1 .56) rotate(45)">
    <rect x="-300" y="-300" width="600" height="600" rx="40" fill="#0d1428" stroke="url(#a)" stroke-width="22"/>
    <g fill="url(#a)" fill-opacity=".55">
      <rect x="-300" y="-300" width="150" height="150"/><rect x="0" y="-300" width="150" height="150"/>
      <rect x="-150" y="-150" width="150" height="150"/><rect x="150" y="-150" width="150" height="150"/>
      <rect x="-300" y="0" width="150" height="150"/><rect x="0" y="0" width="150" height="150"/>
      <rect x="-150" y="150" width="150" height="150"/><rect x="150" y="150" width="150" height="150"/>
    </g>
  </g>
  <!-- a checker -->
  <ellipse cx="702" cy="642" rx="76" ry="40" fill="#8f2440"/>
  <rect x="626" y="606" width="152" height="36" fill="#8f2440"/>
  <ellipse cx="702" cy="606" rx="76" ry="40" fill="url(#chk)"/>
  <!-- a pawn -->
  <ellipse cx="452" cy="636" rx="104" ry="40" fill="#8792c7"/>
  <path d="M372 626 C380 560 420 520 430 456 L474 456 C484 520 524 560 532 626 Z" fill="url(#pawn)"/>
  <rect x="404" y="430" width="96" height="34" rx="14" fill="url(#pawn)"/>
  <circle cx="452" cy="364" r="78" fill="url(#pawn)"/>
  <!-- a die -->
  <g transform="translate(610 290) rotate(14)">
    <rect x="0" y="0" width="150" height="150" rx="32" fill="url(#a)"/>
    <g fill="#0b1226"><circle cx="40" cy="40" r="14"/><circle cx="75" cy="75" r="14"/><circle cx="110" cy="110" r="14"/></g>
  </g>
  <rect x="68" y="68" width="888" height="888" rx="204" fill="none" stroke="url(#a)" stroke-width="8" opacity=".35"/>
  <path d="M842 176c-40 6-78 26-104 58 30-6 58-4 82 6-24 4-46 14-62 30 28-2 52 4 70 16-14-34-8-80 14-110Z" fill="#f2f4ff" opacity=".9"/>
</svg>
